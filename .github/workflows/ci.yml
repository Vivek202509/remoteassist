name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Signaling server (protocol + smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # Runs first: it is pure and fast, and a contract break here explains any
      # broker failure that follows. Reads protocol/fixtures/ from the repo root,
      # which is why this job needs the full checkout rather than just server/.
      - name: Protocol conformance (cross-language fixtures)
        run: npm run protocol

      - name: Broker end-to-end smoke test
        run: npm run smoke

  windows:
    name: Windows (.NET build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The signaling integration tests spawn the real broker as a child process
      # rather than mocking it. A mock would be written from the same understanding
      # as the client, so the two would agree on a misreading of the protocol.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install broker dependencies
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: windows
        run: dotnet build --configuration Release

      # Runs the cross-language protocol/crypto conformance suites plus the
      # end-to-end registration tests against the real Node broker.
      - name: Test
        working-directory: windows
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  android:
    name: Android (build + unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      # gradlew may lose its exec bit when committed from Windows.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build, unit test, lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
