# coturn config for RemoteAssist TURN/STUN.
# Deploy on a host with a public IP. Open UDP/TCP 3478, 5349, and UDP 49152-65535.
# Run: sudo turnserver -c /etc/turnserver.conf -v

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=YOUR.PUBLIC.IP

realm=turn.yourdomain.com
server-name=turn.yourdomain.com

# Time-limited credentials (HMAC-SHA1). The signaling server's TURN_SECRET must
# equal this value so the credentials it hands to clients validate here.
use-auth-secret
static-auth-secret=REPLACE_WITH_LONG_RANDOM_SECRET

fingerprint
lt-cred-mech
no-multicast-peers

min-port=49152
max-port=65535

# TLS (obtain certs via certbot / Let's Encrypt)
cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# Hardening: never relay to internal ranges, no admin CLI, no loopback peers.
no-cli
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
